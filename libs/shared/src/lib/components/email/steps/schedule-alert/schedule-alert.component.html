<div [formGroup]="scheduleForm">
  <div class="my-2">
    <ui-checkbox
      formControlName="scheduleEnabled"
      uiTooltip="{{
        this.scheduleForm.get('scheduleEnabled')?.value
          ? ('components.email.schedule.disable.tooltip' | translate)
          : ('components.email.schedule.enable.tooltip' | translate)
      }}"
    >
      <ng-container ngProjectAs="label">{{
        'components.email.schedule.title' | translate
      }}</ng-container>
    </ui-checkbox>
  </div>
  <div *ngIf="this.scheduleForm.get('scheduleEnabled')?.value">
    <ng-container ngProjectAs="content" class="flex flex-col">
      <!-- Show readable value of the schedule -->
      <ui-alert
        *ngIf="this.scheduleForm.get('cronValue')?.value && scheduleCron.valid"
        variant="primary"
        class="mb-6 block"
      >
        {{ scheduleCron.value | sharedReadableCron }}
      </ui-alert>
      <!-- Cron editor -->
      <ui-cron-editor
        [formControl]="scheduleCron"
        class="grow"
        (cronValidEmitter)="cronIsValid($event)"
      ></ui-cron-editor>
    </ng-container>
  </div>
</div>

<div [formGroup]="scheduleForm">
  <div class="my-2 flex items-center gap-1">
    <ui-checkbox formControlName="scheduleEnabled">
      <ng-container ngProjectAs="label">{{
        'components.email.schedule.title' | translate
      }}</ng-container>
    </ui-checkbox>
    <button
      type="button"
      class="flex cursor-help border-0 bg-transparent p-0"
      [attr.aria-label]="'components.email.schedule.description' | translate"
      [uiTooltip]="'components.email.schedule.description' | translate"
    >
      <ui-icon icon="help_outline" variant="grey"></ui-icon>
    </button>
  </div>
  <div *ngIf="this.scheduleForm.get('scheduleEnabled')?.value">
    <ng-container ngProjectAs="content" class="flex flex-col">
      <p class="mb-2 text-sm text-gray-500">
        {{ 'components.email.schedule.timezoneNotice' | translate }}
      </p>
      <!-- Show readable value of the schedule -->
      <ui-alert
        *ngIf="this.scheduleForm.get('cronValue')?.value && scheduleCron.valid"
        variant="primary"
        class="mb-6 block"
      >
        {{ scheduleCron.value | sharedReadableCron }}
      </ui-alert>
      <!-- Cron editor -->
      <ui-cron-editor
        [formControl]="scheduleCron"
        class="grow"
      ></ui-cron-editor>
    </ng-container>
  </div>
</div>

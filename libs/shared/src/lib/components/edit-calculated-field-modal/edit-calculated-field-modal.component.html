<ui-dialog size="medium">
  <ng-container ngProjectAs="header">
    <div class="flex items-start gap-2">
      <h3 class="font-semibold">
        {{
          (this.data.calculatedField
            ? 'components.calculatedFields.edit'
            : 'components.calculatedFields.add'
          ) | translate
        }}
      </h3>
      <ui-icon
        icon="help_outline"
        class="cursor-pointer"
        variant="grey"
        (click)="openReferenceModal()"
        [uiTooltip]="'components.calculatedFields.reference.open' | translate"
      ></ui-icon>
    </div>
  </ng-container>
  <ng-container ngProjectAs="content">
    <form [formGroup]="form">
      <div class="flex flex-col">
        <!-- @todo: check -->
        <div uiFormFieldDirective>
          <label>{{
            'components.aggregationBuilder.fieldName' | translate
          }}</label>
          <input formControlName="name" type="string" />
          <ui-icon
            icon="info"
            class="cursor-pointer"
            variant="grey"
            uiSuffix
            [uiTooltip]="'components.calculatedFields.hint.name' | translate"
          ></ui-icon>
        </div>
        <div uiFormFieldDirective>
          <label>{{
            'components.calculatedFields.expression' | translate
          }}</label>
          <shared-editor-control
            formControlName="expression"
            [editorConfig]="editor"
          ></shared-editor-control>
          <ui-icon
            icon="info"
            class="cursor-pointer"
            variant="grey"
            uiSuffix
            [uiTooltip]="'common.tooltip.editor.insert' | translate"
          ></ui-icon>
        </div>
        <!-- Guided builder for related-record aggregations -->
        <div *ngIf="data.resourceId">
          <ui-button
            icon="post_add"
            category="tertiary"
            variant="primary"
            (click)="openRelatedValueBuilder()"
            [uiTooltip]="
              'components.calculatedFields.relatedBuilder.tooltip' | translate
            "
          >
            {{ 'components.calculatedFields.relatedBuilder.open' | translate }}
          </ui-button>
        </div>
      </div>
    </form>
  </ng-container>
  <ng-container ngProjectAs="actions">
    <ui-button [uiDialogClose] variant="default">
      {{ 'common.close' | translate }}
    </ui-button>
    <ui-button
      category="secondary"
      variant="primary"
      (click)="onSubmit()"
      cdkFocusInitial
      [disabled]="!form.valid"
    >
      {{ 'common.save' | translate }}
    </ui-button>
  </ng-container>
</ui-dialog>

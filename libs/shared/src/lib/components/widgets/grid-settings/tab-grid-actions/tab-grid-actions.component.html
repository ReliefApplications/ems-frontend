<!-- Header -->
<h2>
  {{ 'components.widget.settings.grid.buttons.title' | translate }}
</h2>
<!-- Add new action -->
<div class="flex justify-end mb-4">
  <ui-button icon="add" variant="primary" (click)="addAction($event)">
    {{ 'components.widget.settings.grid.buttons.create' | translate }}
  </ui-button>
</div>
<!-- Available grid actions -->
<ui-tabs
  class="grow"
  *ngIf="gridActions.length > 0"
  cdkDropListOrientation="horizontal"
  cdkDropList
  (cdkDropListDropped)="onReorder($event)"
>
  <ui-tab *ngFor="let action of gridActions.controls; let i = index" cdkDrag>
    <!-- Action label - tab label -->
    <ng-container ngProjectAs="label">
      <div class="flex items-center">
        <!-- Error indicator -->
        <ui-icon
          *ngIf="action.invalid"
          icon="error_outline"
          variant="danger"
          [size]="18"
        ></ui-icon>
        <!-- Action name -->
        <span
          class="max-w-[100px] overflow-hidden text-ellipsis whitespace-nowrap"
          >{{
            action.value.name.length > 0
              ? action.value.name
              : ('components.widget.settings.grid.buttons.defaultName'
                | translate)
          }}
        </span>
        <!-- Reorder -->
        <ui-button
          variant="grey"
          [isIcon]="true"
          size="small"
          cdkDragHandle
          icon="drag_indicator"
          class="draggable"
          [uiTooltip]="'common.tooltip.dragDrop' | translate"
        >
        </ui-button>
      </div>
    </ng-container>
    <!-- Action form - tab content -->
    <shared-grid-action-settings
      [widgetFormGroup]="formGroup"
      [formGroup]="$any(action)"
      [fields]="fields"
      [channels]="channels"
      [templates]="templates"
      [distributionLists]="distributionLists"
      [relatedForms]="relatedForms"
      (deleteAction)="deleteAction(i)"
      (loadChannels)="loadChannels.emit()"
    >
    </shared-grid-action-settings>
  </ui-tab>
</ui-tabs>

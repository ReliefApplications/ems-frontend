<div class="h-full flex flex-col">
  <ui-tabs
    [selectedIndex]="selectedIndex"
    (openedTab)="selectedIndex = $event.index"
    class="h-full overflow-hidden"
    *ngIf="tabs && tabs.length > 0; else empty"
    (willDetach)="onWillDetach()"
    (didAttach)="onDidAttach()"
  >
    <ng-container *ngFor="let tab of tabs">
      <ng-container *ngIf="!tab.hide">
        <ui-tab [id]="tab.id">
          <ng-container ngProjectAs="label">
            <div class="flex items-center gap-2">
              <ui-icon
                *ngIf="tab.showIcon !== false && tab.icon"
                [icon]="tab.icon"
                [fontFamily]="tab.icon ? 'fa' : 'material'"
                [size]="18"
              ></ui-icon>
              <span
                *ngIf="
                  tab.showName !== false || tab.showIcon === false || !tab.icon
                "
                class="truncate"
              >
                {{ tab.label }}
              </span>
            </div>
          </ng-container>
          <ng-template uiTabContent>
            <shared-tab
              class="flex h-full w-full"
              [id]="tab.id"
              [structure]="tab.structure"
              [usePadding]="usePadding"
              [options]="tab.gridOptions"
            ></shared-tab>
          </ng-template>
        </ui-tab>
      </ng-container>
    </ng-container>
  </ui-tabs>
  <ng-template #empty>
    <div class="m-auto flex justify-center">
      <ui-button variant="primary" category="secondary" (click)="openSettings()"
        >{{ 'components.widget.grid.openSettings' | translate }}
      </ui-button>
    </div>
  </ng-template>
</div>

<ng-template #headerTemplate>
  <div class="flex-1 overflow-hidden">
    <ng-template [cdkPortalOutlet]="portal"></ng-template>
  </div>
</ng-template>

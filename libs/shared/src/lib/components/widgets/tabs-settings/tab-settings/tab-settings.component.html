<div class="flex flex-wrap items-center mb-6 gap-4 justify-end">
  <!-- Show tab property -->
  <div [formGroup]="tabGroup" class="mr-3">
    <ui-toggle formControlName="hide">
      <ng-container ngProjectAs="label"> Hide tab by default</ng-container>
    </ui-toggle>
  </div>
  <!-- Edit the grid options -->
  <ui-button icon="style" variant="primary" (click)="onEditGridOptions()">
    {{ 'components.application.dashboard.settings.gridOptions' | translate }}
  </ui-button>
  <!-- Remove tab -->
  <ui-button (click)="delete.emit()" variant="danger" category="tertiary">{{
    'components.widget.settings.tabs.deleteTab' | translate
  }}</ui-button>
</div>
<!-- Tab label & display options -->
<div [formGroup]="tabGroup" class="flex flex-col gap-4">
  <div uiFormFieldDirective>
    <label>{{ 'common.label' | translate }}</label>
    <input formControlName="label" type="text" placeholder="Type a label..." />
  </div>
  <!-- Nav bar settings -->
  <ng-container formGroupName="navBar">
    <!-- Show name in nav bar -->
    <ui-toggle formControlName="showName">
      <ng-container ngProjectAs="label">
        {{ 'components.widget.settings.tabs.navBar.showName' | translate }}
        <ui-icon
          class="cursor-help self-center"
          icon="info_outline"
          [size]="18"
          variant="grey"
          [uiTooltip]="
            'components.widget.settings.tabs.tooltip.navBar' | translate
          "
        ></ui-icon>
      </ng-container>
    </ui-toggle>
    <!-- Show icon in nav bar -->
    <ui-toggle formControlName="showIcon">
      <ng-container ngProjectAs="label">
        {{ 'components.widget.settings.tabs.navBar.showIcon' | translate }}
        <ui-icon
          class="cursor-help self-center"
          icon="info_outline"
          [size]="18"
          variant="grey"
          [uiTooltip]="
            'components.widget.settings.tabs.tooltip.navBar' | translate
          "
        ></ui-icon>
      </ng-container>
    </ui-toggle>
  </ng-container>
  <!-- Icon picker -->
  <div uiFormFieldDirective>
    <label>{{
      'components.widget.settings.tabs.selectIcon' | translate
    }}</label>
    <shared-icon-picker
      formControlName="icon"
      [placeholder]="
        'components.widget.settings.iconPicker.placeholder' | translate
      "
      [nullable]="true"
    ></shared-icon-picker>
  </div>
</div>
<!-- tab structure edition -->
<shared-widget-grid
  class="flex-1"
  [widgets]="tabGroup.value.structure"
  [canUpdate]="true"
  [options]="gridOptions"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)"
  (style)="onStyle($event)"
  (add)="onAdd($event)"
></shared-widget-grid>

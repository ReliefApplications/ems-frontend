<ui-dialog size="fullscreen">
  <!-- Header -->
  <ng-container ngProjectAs="header">
    <div class="flex items-center justify-between gap-4 w-full">
      <h3 class="font-semibold truncate" [title]="data.fileName">
        {{ data.fileName }}
      </h3>
    </div>
  </ng-container>
  <!-- Content -->
  <ng-container ngProjectAs="content">
    <div class="file-preview-content">
      <!-- Image preview -->
      <img
        *ngIf="isImage; else pdfPreview"
        class="file-preview-image"
        [src]="data.url"
        [alt]="data.fileName"
      />
      <ng-template #pdfPreview>
        <!-- Iframe preview -->
        <iframe
          class="file-preview-frame"
          [src]="safeUrl"
          [title]="data.fileName"
        ></iframe>
      </ng-template>
    </div>
  </ng-container>
  <!-- Actions -->
  <ng-container ngProjectAs="actions">
    <!-- Close -->
    <ui-button [uiDialogClose] variant="default">
      {{ 'common.close' | translate }}
    </ui-button>
    <!-- Download -->
    <ui-button
      category="secondary"
      variant="primary"
      cdkFocusInitial
      icon="file_download"
      (click)="download()"
    >
      {{ 'common.download' | translate }}
    </ui-button>
  </ng-container>
</ui-dialog>

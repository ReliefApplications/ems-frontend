<kendo-badge-container>
  <ui-button
    [size]="'large'"
    variant="light"
    [uiMenuTriggerFor]="notificationMenu"
    icon="notifications"
    [isIcon]="true"
    [uiTooltip]="'components.notifications.title' | translate"
  >
  </ui-button>
  <kendo-badge
    shape="dot"
    themeColor="error"
    size="small"
    class="!-translate-x-1/4 !translate-y-full"
    *ngIf="notifications.length > 0"
  ></kendo-badge>
</kendo-badge-container>
<!-- Notification menu -->
<shared-notification-menu
  #notificationMenu
  [notifications]="notifications"
  [hasMore]="hasMoreNotifications"
  [loading]="loadingNotifications"
  (markAllAsRead)="onMarkAllNotificationsAsRead()"
  (loadMore)="onLoadMoreNotifications($event)"
  (markAsSeen)="onMarkSingleNotification($event.event, $event.notification)"
></shared-notification-menu>

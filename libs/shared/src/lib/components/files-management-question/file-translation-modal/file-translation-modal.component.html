<ui-dialog size="small">
  <ng-container ngProjectAs="header">
    <h3 class="font-semibold">
      {{ 'components.filesManagement.translation.title' | translate }}
    </h3>
  </ng-container>
  <ng-container ngProjectAs="content">
    <div class="flex flex-col gap-3">
      <p class="text-sm text-gray-500 m-0">
        {{
          'components.filesManagement.translation.description'
            | translate : { name: data.file.name }
        }}
      </p>
      <div class="flex flex-col gap-1">
        <kendo-label
          [for]="languageDropdown"
          [text]="'components.filesManagement.translation.language' | translate"
        ></kendo-label>
        <kendo-dropdownlist
          #languageDropdown
          [data]="data.languages"
          textField="text"
          valueField="value"
          [valuePrimitive]="true"
          [formControl]="languageControl"
        ></kendo-dropdownlist>
      </div>
      <div class="flex flex-col gap-1">
        <kendo-label
          [text]="'components.filesManagement.translation.file' | translate"
        ></kendo-label>
        <!-- Single file, validated against the file question restrictions -->
        <kendo-fileselect
          [multiple]="false"
          [restrictions]="restrictions"
          [accept]="accept"
          (select)="onSelect($event)"
          (remove)="onRemove()"
        >
          <kendo-fileselect-messages
            [select]="
              'components.filesManagement.translation.selectFile' | translate
            "
            [dropFilesHere]="'components.filesUpload.dropFilesHere' | translate"
          ></kendo-fileselect-messages>
        </kendo-fileselect>
      </div>
      <p *ngIf="errorMessage" class="k-form-error text-red-600 text-sm m-0">
        {{ errorMessage }}
      </p>
    </div>
  </ng-container>
  <ng-container ngProjectAs="actions">
    <ui-button [uiDialogClose] variant="default">
      {{ 'common.cancel' | translate }}
    </ui-button>
    <ui-button
      category="secondary"
      variant="primary"
      [disabled]="!file || !languageControl.value"
      (click)="onConfirm()"
    >
      {{ 'common.add' | translate }}
    </ui-button>
  </ng-container>
</ui-dialog>

<div class="files-management-question flex flex-col gap-3">
  <div class="flex flex-col sm:flex-row gap-3">
    <div class="flex flex-col gap-1 flex-1">
      <kendo-label
        [for]="languageADropdown"
        [text]="'components.filesManagement.languageA' | translate"
      ></kendo-label>
      <kendo-dropdownlist
        #languageADropdown
        [data]="languageChoices"
        [defaultItem]="allLanguagesChoice"
        textField="text"
        valueField="value"
        [valuePrimitive]="true"
        [formControl]="languageAControl"
      ></kendo-dropdownlist>
    </div>
    <div class="flex flex-col gap-1 flex-1">
      <kendo-label
        [for]="languageBDropdown"
        [text]="'components.filesManagement.languageB' | translate"
      ></kendo-label>
      <kendo-dropdownlist
        #languageBDropdown
        [data]="languageChoices"
        [defaultItem]="allLanguagesChoice"
        textField="text"
        valueField="value"
        [valuePrimitive]="true"
        [formControl]="languageBControl"
      ></kendo-dropdownlist>
    </div>
  </div>

  <kendo-grid
    [data]="rows"
    [sortable]="true"
    [sort]="sort"
    (sortChange)="onSortChange($event)"
    [scrollable]="'none'"
  >
    <kendo-grid-column
      field="file.name"
      [title]="'components.filesManagement.fileName' | translate"
    >
      <ng-template kendoGridCellTemplate let-dataItem>
        <span class="inline-flex items-center gap-2">
          <span class="k-icon" [ngClass]="dataItem.icon"></span>
          <span [title]="dataItem.file.name">{{ dataItem.file.name }}</span>
        </span>
      </ng-template>
    </kendo-grid-column>
    <kendo-grid-column
      field="fieldTitle"
      [title]="'components.filesManagement.field' | translate"
    ></kendo-grid-column>
    <kendo-grid-column
      field="languageLabel"
      [title]="'components.filesManagement.language' | translate"
    ></kendo-grid-column>
    <kendo-grid-column
      field="outdated"
      [title]="'components.filesManagement.status' | translate"
      [width]="140"
    >
      <ng-template kendoGridCellTemplate let-dataItem>
        <span
          *ngIf="dataItem.outdated; else upToDateTmpl"
          class="inline-flex items-center gap-1 text-amber-600"
        >
          <span class="k-icon k-i-warning"></span>
          {{ 'components.filesManagement.statusOutdated' | translate }}
        </span>
        <ng-template #upToDateTmpl>
          <span class="inline-flex items-center gap-1 text-green-700">
            <span class="k-icon k-i-check"></span>
            {{ 'components.filesManagement.statusUpToDate' | translate }}
          </span>
        </ng-template>
      </ng-template>
    </kendo-grid-column>
    <kendo-grid-column
      [title]="'common.actions' | translate"
      [sortable]="false"
      [width]="180"
    >
      <ng-template kendoGridCellTemplate let-dataItem>
        <div class="flex items-center justify-end gap-1">
          <button
            kendoButton
            fillMode="flat"
            icon="download"
            [title]="'components.filesManagement.download' | translate"
            (click)="download(dataItem)"
          ></button>
          <!--
            Azure Translator integration is out of scope for now: this stays
            disabled until that work is picked up.
          -->
          <button
            kendoButton
            fillMode="flat"
            [disabled]="true"
            [title]="
              'components.filesManagement.downloadTranslationTooltip'
                | translate
            "
          >
            <span class="material-icons text-base leading-none">translate</span>
          </button>
          <button
            *ngIf="dataItem.canOutdate"
            kendoButton
            fillMode="flat"
            [icon]="dataItem.outdated ? 'check' : 'warning'"
            [title]="
              (dataItem.outdated
                ? 'components.form.file.outdated.markAsActive'
                : 'components.form.file.outdated.markAsOutdated'
              ) | translate
            "
            (click)="toggleOutdated(dataItem)"
          ></button>
          <button
            *ngIf="dataItem.canRemove"
            kendoButton
            fillMode="flat"
            themeColor="error"
            icon="delete"
            [title]="
              (dataItem.canOutdate
                ? 'components.form.file.outdated.removePermanently'
                : 'components.form.file.remove'
              ) | translate
            "
            (click)="remove(dataItem)"
          ></button>
        </div>
      </ng-template>
    </kendo-grid-column>
    <ng-template kendoGridNoRecordsTemplate>
      <shared-empty
        class="m-auto"
        icon="draft"
        [title]="'components.filesManagement.empty' | translate"
      ></shared-empty>
    </ng-template>
  </kendo-grid>
</div>

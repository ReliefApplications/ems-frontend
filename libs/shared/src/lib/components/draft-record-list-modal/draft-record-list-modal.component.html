<ui-dialog [size]="'medium'">
  <ng-container ngProjectAs="header">
    <h3 class="font-semibold">
      {{ 'components.form.draftRecords.select' | translate }}
    </h3>
  </ng-container>

  <ng-container ngProjectAs="content">
    <kendo-grid
      class="mt-4"
      [loading]="loading"
      [data]="dataset"
      [pageable]="pagerSettings"
      [skip]="pageInfo.skip"
      [pageSize]="pageInfo.take"
      [sortable]="{ allowUnsort: false, mode: 'single' }"
      [sort]="sort"
      (pageChange)="onPage($event)"
      (sortChange)="onSort($event)"
    >
      <kendo-grid-column
        field="createdAt"
        [title]="'components.form.draftRecords.creationDate' | translate"
      >
        <ng-template kendoGridCellTemplate let-dataItem>
          {{ dataItem.createdAt | sharedDate : 'medium' }}
        </ng-template>
      </kendo-grid-column>
      <kendo-grid-column
        field="modifiedAt"
        [title]="'components.form.draftRecords.modificationDate' | translate"
      >
        <ng-template kendoGridCellTemplate let-dataItem>
          {{ dataItem.modifiedAt | sharedDate : 'medium' }}
        </ng-template>
      </kendo-grid-column>
      <kendo-grid-column [sortable]="false" [width]="150">
        <ng-template kendoGridCellTemplate let-dataItem>
          <div class="flex items-center justify-end">
            <ui-button
              [isIcon]="true"
              [icon]="
                loadingDraftId === dataItem.id && loadingDraftAction === 'load'
                  ? 'hourglass_top'
                  : 'refresh'
              "
              variant="primary"
              [disabled]="loading || !!loadingDraftId"
              uiTooltip="{{ 'components.form.draftRecords.load' | translate }}"
              (click)="onClose(dataItem)"
            ></ui-button>
            <ui-button
              [isIcon]="true"
              [icon]="
                loadingDraftId === dataItem.id &&
                loadingDraftAction === 'preview'
                  ? 'hourglass_top'
                  : 'visibility'
              "
              variant="primary"
              [disabled]="loading || !!loadingDraftId"
              uiTooltip="{{
                'components.form.draftRecords.preview' | translate
              }}"
              (click)="onPreview(dataItem)"
            ></ui-button>
            <ui-button
              [isIcon]="true"
              icon="delete"
              variant="danger"
              [disabled]="loading || !!loadingDraftId"
              uiTooltip="{{
                'components.form.draftRecords.delete' | translate
              }}"
              (click)="onDelete(dataItem)"
            ></ui-button>
          </div>
        </ng-template>
      </kendo-grid-column>
      <ng-template kendoGridNoRecordsTemplate>
        <shared-empty
          *ngIf="!loading"
          [title]="'components.form.draftRecords.noDrafts' | translate"
        ></shared-empty>
      </ng-template>
    </kendo-grid>
  </ng-container>

  <ng-container ngProjectAs="actions">
    <ui-button uiDialogClose variant="default">
      {{ 'common.close' | translate }}
    </ui-button>
  </ng-container>
</ui-dialog>

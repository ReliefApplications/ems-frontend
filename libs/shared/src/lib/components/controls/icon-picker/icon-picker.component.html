<div
  class="w-full cursor-pointer flex items-center"
  (click)="onOpenSelect()"
  #trigger="cdkOverlayOrigin"
  cdkOverlayOrigin
>
  <ng-container *ngIf="value; else defaultTemplate">
    <span class="mr-2"></span>{{ value }}
    <ui-button
      *ngIf="nullable"
      class="ml-auto"
      size="small"
      [isIcon]="true"
      icon="close"
      variant="danger"
      (click)="$event.stopPropagation(); setIcon(null)"
      [uiTooltip]="'common.remove' | translate"
    ></ui-button>
  </ng-container>
</div>

<ng-template #defaultTemplate>
  <div class="text-gray-400 text-sm">{{ placeholder }}</div>
</ng-template>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="showList"
>
  <shared-icon-picker-popup
    [icons]="icons"
    [color]="color"
    (close)="setIcon($event)"
  ></shared-icon-picker-popup>
</ng-template>

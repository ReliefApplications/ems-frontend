<shared-filter
  *ngIf="!loading; else loadingTmpl"
  [form]="form"
  [fields]="filterFields"
  [disabled]="disabled"
  [dlContextSettings]="dlContextSettings"
></shared-filter>

<!-- CUSTOM EDITOR FOR DATES -->
<ng-template #dateEditor let-valueControl="valueControl">
  <shared-date-filter-editor
    [control]="valueControl"
  ></shared-date-filter-editor>
</ng-template>

<ng-template #loadingTmpl>
  <ui-spinner></ui-spinner>
  <p class="text-center text-gray-600 mt-3">
    {{ 'components.queryBuilder.filter.loading' | translate }}
  </p>
</ng-template>

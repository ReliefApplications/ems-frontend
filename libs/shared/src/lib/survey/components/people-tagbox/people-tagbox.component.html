<ui-select-menu
  [formControl]="control"
  (opened)="onSelectOpen()"
  (closed)="onSelectClose()"
  [isGraphQlSelect]="true"
  [placeholder]="placeholder"
  [multiselect]="true"
>
  <!-- Search -->
  <div
    class="w-full flex shadow-sm !sticky top-0 border-b-gray-300 !h-auto z-10 !bg-white !p-0"
  >
    <input
      class="bg-transparent block w-full px-3 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-6 border-0"
      [formControl]="searchControl"
      placeholder="Search for people..."
      type="text"
    />
    <ui-spinner
      [size]="'medium'"
      *ngIf="loading"
      class="items-center"
    ></ui-spinner>
    <ui-button
      [isIcon]="true"
      icon="close"
      (click)="clearSearch()"
      *ngIf="searchControl.value"
    ></ui-button>
  </div>
  <!-- Options -->
  <ui-select-option *ngFor="let person of options" [value]="person.userid">
    {{ getDisplayText(person) }}
  </ui-select-option>
  <!-- Empty state hint -->
  <div
    *ngIf="options.length === 0 && !loading && searchControl.value.length < minSearchLength"
    class="p-3 text-gray-500 text-sm text-center"
  >
    Type at least {{ minSearchLength }} characters to search
  </div>
</ui-select-menu>

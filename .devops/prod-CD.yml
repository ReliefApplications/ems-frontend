# Node.js with Angular
# Build a Node.js project that uses Angular.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- prod

pool:
  vmImage: ubuntu-latest

steps:
- task: UseNode@1
  inputs:
    version: '24.x'
  displayName: 'Install Node.js'

- script: |
    npm ci
  displayName: 'npm install'

- script: |
    npx kendo-ui-license activate
  displayName: 'Activate Kendo UI License'
  env:
    KENDO_UI_LICENSE: $(KENDO_UI_LICENSE)

- script: |
    npx nx run front-office:build:azure-prod --skip-nx-cache
  displayName: 'Build front-office'
  env:
    NODE_OPTIONS: --max-old-space-size=8192

- script: |
    npx nx run back-office:build:azure-prod --skip-nx-cache
  displayName: 'Build back-office'
  env:
    NODE_OPTIONS: --max-old-space-size=8192

- script: |
    npx nx run web-widgets:build:azure-prod --skip-nx-cache
    npx nx run web-widgets:bundle
  displayName: 'Build and bundle web-widgets'
  env:
    NODE_OPTIONS: --max-old-space-size=8192

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist/apps/front-office'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/prod/front-office/$(Build.BuildId).zip'
    replaceExistingArchive: true

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist/apps/back-office'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/prod/back-office/$(Build.BuildId).zip'
    replaceExistingArchive: true

# web-widgets: bundle + shared assets, laid out as expected by tinymceBaseUrl / i18nUrl
# in apps/web-widgets/src/environments ({base}/app-builder.js, {base}/tinymce, {base}/i18n)
- task: CopyFiles@2
  displayName: 'Copy web-widgets bundle'
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)/widgets'
    Contents: '**'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/temp/web-widgets'

- task: CopyFiles@2
  displayName: 'Copy tinymce assets for web-widgets'
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)/dist/apps/front-office/assets/tinymce'
    Contents: '**'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/temp/web-widgets/tinymce'

- task: CopyFiles@2
  displayName: 'Copy i18n assets for web-widgets'
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)/dist/apps/front-office/assets/i18n'
    Contents: '**'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/temp/web-widgets/i18n'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/temp/web-widgets'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/prod/web-widgets/$(Build.BuildId).zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/prod/front-office/$(Build.BuildId).zip'
    ArtifactName: 'prod-front-office'
    publishLocation: 'Container'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/prod/back-office/$(Build.BuildId).zip'
    ArtifactName: 'prod-back-office'
    publishLocation: 'Container'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/prod/web-widgets/$(Build.BuildId).zip'
    ArtifactName: 'prod-web-widgets'
    publishLocation: 'Container'

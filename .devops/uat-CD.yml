# Node.js with Angular
# Build a Node.js project that uses Angular.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  - uat

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseNode@1
    inputs:
      version: '24.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci
    displayName: 'npm install'

  - script: |
      npx kendo-ui-license activate
    displayName: 'Activate Kendo UI License'
    env:
      KENDO_UI_LICENSE: $(KENDO_UI_LICENSE)

  - script: |
      npx nx run front-office:build:azure-uat --skip-nx-cache
    displayName: 'Build front-office'
    env:
      NODE_OPTIONS: --max-old-space-size=6144

  - script: |
      npx nx run back-office:build:azure-uat --skip-nx-cache
    displayName: 'Build back-office'
    env:
      NODE_OPTIONS: --max-old-space-size=6144

  - script: |
      npx nx run public-forms:build:azure-uat --skip-nx-cache
    displayName: 'Build public-forms'
    env:
      NODE_OPTIONS: --max-old-space-size=6144

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist/apps/front-office'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/uat/front-office/$(Build.BuildId).zip'
      replaceExistingArchive: true

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist/apps/back-office'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/uat/back-office/$(Build.BuildId).zip'
      replaceExistingArchive: true

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist/apps/public-forms'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/uat/public-forms/$(Build.BuildId).zip'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/uat/front-office/$(Build.BuildId).zip'
      ArtifactName: 'uat-front-office'
      publishLocation: 'Container'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/uat/back-office/$(Build.BuildId).zip'
      ArtifactName: 'uat-back-office'
      publishLocation: 'Container'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/uat/public-forms/$(Build.BuildId).zip'
      ArtifactName: 'uat-public-forms'
      publishLocation: 'Container'

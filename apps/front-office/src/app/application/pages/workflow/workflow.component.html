<!-- Skeleton when loading -->
<ng-container
  *sharedSkeleton="
    loading;
    repeat: 1;
    height: '32px';
    width: '120px';
    shape: 'rectangle'
  "
>
  <ng-container *ngIf="workflow && workflow.page?.showName">
    <div class="flex flex-wrap items-center justify-between mb-3 gap-4">
      <!-- Title -->
      <div class="flex items-center gap-1">
        <h1 class="!m-0 overflow-hidden text-ellipsis">
          {{ workflow.name }}
        </h1>
      </div>
    </div>
  </ng-container>
</ng-container>
<!-- STEPS -->
<shared-workflow-stepper
  [loading]="loading"
  [steps]="steps"
  (openStep)="onOpenStep($event)"
  [activeStep]="activeStep"
  class="block"
>
  <shared-dashboard-export-button
    *ngIf="$any(activeOutletComponent)?.dashboard"
    [title]="
      $any(activeOutletComponent)?.dashboard?.nameTranslations ||
      $any(activeOutletComponent)?.dashboard?.name
    "
    [exporter]="$any(activeOutletComponent)?.elementRef"
    class="self-center"
  ></shared-dashboard-export-button>
</shared-workflow-stepper>
<router-outlet
  (activate)="onActivate($event)"
  (deactivate)="clearSubscriptions()"
></router-outlet>

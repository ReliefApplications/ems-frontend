<div class="flex justify-end mb-6">
  <div class="flex gap-2 items-center flex-wrap justify-end">
    <ui-button
      *ngIf="resource.canUpdate && !showDeletedRecords"
      icon="search_off"
      category="primary"
      variant="danger"
      (click)="onSwitchView()"
    >
      {{ 'components.records.showArchived' | translate }}
    </ui-button>
    <ui-button
      *ngIf="resource.canUpdate && showDeletedRecords"
      icon="restore_page"
      category="primary"
      variant="success"
      (click)="onSwitchView()"
    >
      {{ 'components.records.showActive' | translate }}
    </ui-button>
    <ui-button
      icon="file_download"
      category="secondary"
      variant="primary"
      [uiMenuTriggerFor]="menu"
    >
      {{
        'common.downloadObject'
          | translate : { name: 'common.record.few' | translate }
      }}
    </ui-button>
    <ui-menu #menu>
      <button uiMenuItem (click)="onDownload('csv')">.csv</button>
      <button uiMenuItem (click)="onDownload('xlsx')">.xlsx</button>
    </ui-menu>
    <ui-button
      icon="file_upload"
      category="secondary"
      variant="primary"
      [uiTooltip]="'components.records.upload.hint' | translate"
      (click)="showUpload = !showUpload"
      cdkOverlayOrigin
      #uploadTrigger="cdkOverlayOrigin"
    >
      {{
        'common.uploadObject'
          | translate : { name: 'common.record.few' | translate }
      }}
    </ui-button>
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="uploadTrigger"
      [cdkConnectedOverlayOpen]="showUpload"
    >
      <app-upload-menu
        (close)="showUpload = false"
        (upload)="uploadFileData($event)"
        (download)="onDownloadTemplate()"
      ></app-upload-menu>
    </ng-template>
  </div>
</div>

<shared-core-grid
  *ngIf="gridSettings"
  [settings]="gridSettings"
  [defaultLayout]="defaultLayout"
  [showExport]="true"
  [canDownloadRecords]="true"
  [selectable]="false"
  [reorderable]="false"
  [filterable]="false"
  (edit)="onUpdateRecord($event)"
></shared-core-grid>
